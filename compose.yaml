## Uncomment the poll configuration section here and in the service `environment:` section if you want to enable polling of a repository.
x-poll-config: &poll-config
 POLL_CONFIG: |
   - url: https://github.com/Victory-Family-Church/doco-deploy  # This is the repository to poll
     reference: prod  # Optional: specify the branch or tag to poll, defaults to 'main'
     interval: 180  # Optional: specify the interval in seconds to poll the repository, defaults to 180 seconds (3 minutes)
     target: "resi-aux"  # Optional: use to target a specific deployment config file, e.g., "test" -> .doco-cd.test.yaml

services:
  doco-cd:
    #container_name: doco-cd
    # You can also pin to a specific tag (version)
    # Available tags can be found here: https://github.com/kimdre/doco-cd/pkgs/container/doco-cd
    image: ghcr.io/kimdre/doco-cd:0.118.1
    ports:
      - "9120:9120" # Prometheus metrics
      - "9121:80"

    environment:
      TZ: America/New_York
      HTTP_PORT: 80
      SOPS_AGE_KEY_FILE: /run/secrets/sops_age_key
      API_SECRET_FILE: /run/secrets/api_key
      <<: *poll-config  # Uncomment this line to use the poll configuration from above (the `x-poll-config` section).
    networks: 
      backbone:
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - doco_data:/data
    # healthcheck:
      # test: [ "CMD", "curl", "-f", "http://localhost:80/v1/health" ]  # Also change the port here if you change the default HTTP_PORT env var
      # start_period: 15s
      # interval: 30s
      # timeout: 5s
      # retries: 3
    secrets:
      - sops_age_key
      - git_access_token
      - api_key
    deploy:
      replicas: 0
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
        window: 120s


secrets:
  sops_age_key: # Preferably detatch this from any public git repos. This is an immutable mount on every host.
    file: /system-data/secrets/sops_age_key.txt
  git_access_token: 
    file: /system-data/secrets/git-pat.txt
  api_key: 
    file: /system-data/secrets/doco-cd_api-key.txt
  # git_access_token:
  #   external: true
  # webhook_secret:
  #   external: true

volumes: 
  doco_data: